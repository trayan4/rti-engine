name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC — no stored Azure credential
  contents: read

env:
  RESOURCE_GROUP: rg-rti-engine
  REGISTRY_NAME: acrrtiengine
  IMAGE_NAME: rti-engine

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}

    steps:
      - uses: actions/checkout@v5

      - name: Compute image tag
        id: tag
        run: echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the container registry
        run: az acr login --name ${{ env.REGISTRY_NAME }}

      - name: Build and push
        run: |
          docker build \
            -t ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }} \
            -t ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

  deploy-infrastructure:
    name: Deploy infrastructure
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - uses: actions/checkout@v5

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >
            imageTag=${{ needs.build-and-push.outputs.image_tag }}
            databaseAdminPassword=${{ secrets.DATABASE_ADMIN_PASSWORD }}
            azureOpenAiEndpoint=${{ vars.AZURE_OPENAI_ENDPOINT }}
            azureOpenAiApiKey=${{ secrets.AZURE_OPENAI_API_KEY }}
            anthropicApiKey=${{ secrets.ANTHROPIC_API_KEY }}
            groqApiKey=${{ secrets.GROQ_API_KEY }}
            pineconeApiKey=${{ secrets.PINECONE_API_KEY }}
            neo4jPassword=${{ secrets.NEO4J_PASSWORD }}
          failOnStdErr: false

  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    needs: deploy-infrastructure

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get database host
        id: db
        run: |
          host=$(az deployment group show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name main \
            --query properties.outputs.databaseHost.value -o tsv)
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Apply migrations
        env:
          POSTGRES_DSN: postgresql://rtiadmin:${{ secrets.DATABASE_ADMIN_PASSWORD }}@${{ steps.db.outputs.host }}:5432/rti_engine?sslmode=require
        run: make migrate
