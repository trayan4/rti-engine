name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC — no stored Azure credential
  contents: read

env:
  RESOURCE_GROUP: rg-rti-engine

jobs:
  bootstrap:
    name: Deploy infrastructure (bootstrap)
    runs-on: ubuntu-latest
    outputs:
      registry_server: ${{ steps.outputs.outputs.registry_server }}

    # The registry, database and identity have no dependency on an image
    # existing. deployApps=false skips only the container apps, which is
    # what breaks the chicken-and-egg problem: nothing can be pushed to a
    # registry that does not exist yet.
    steps:
      - uses: actions/checkout@v5

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep (bootstrap)
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >
            deployApps=false
            databaseAdminPassword=${{ secrets.DATABASE_ADMIN_PASSWORD }}
            azureOpenAiEndpoint=${{ vars.AZURE_OPENAI_ENDPOINT }}
            azureOpenAiChatDeployment=${{ vars.AZURE_OPENAI_CHAT_DEPLOYMENT }}
            azureOpenAiMiniDeployment=${{ vars.AZURE_OPENAI_MINI_DEPLOYMENT }}
            azureOpenAiEmbeddingDeployment=${{ vars.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
            anthropicModel=${{ vars.ANTHROPIC_MODEL }}
            groqModel=${{ vars.GROQ_MODEL }}
            azureOpenAiApiKey=${{ secrets.AZURE_OPENAI_API_KEY }}
            anthropicApiKey=${{ secrets.ANTHROPIC_API_KEY }}
            groqApiKey=${{ secrets.GROQ_API_KEY }}
            pineconeApiKey=${{ secrets.PINECONE_API_KEY }}
            neo4jPassword=${{ secrets.NEO4J_PASSWORD }}
          failOnStdErr: false

      - name: Read the registry name
        id: outputs
        run: |
          server=$(az deployment group show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name main \
            --query properties.outputs.registryServer.value -o tsv)
          echo "registry_server=$server" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: bootstrap
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}

    # The registry name is read from the bootstrap deployment's own
    # output rather than assumed: it includes a uniqueString() suffix
    # that only exists once Bicep has actually created it.
    steps:
      - uses: actions/checkout@v5

      - name: Compute image tag
        id: tag
        run: echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the container registry
        run: az acr login --name $(echo "${{ needs.bootstrap.outputs.registry_server }}" | cut -d. -f1)

      - name: Build and push
        env:
          REGISTRY: ${{ needs.bootstrap.outputs.registry_server }}
        run: |
          docker build \
            -t "$REGISTRY/rti-engine:${{ steps.tag.outputs.value }}" \
            -t "$REGISTRY/rti-engine:latest" \
            .
          docker push "$REGISTRY/rti-engine:${{ steps.tag.outputs.value }}"
          docker push "$REGISTRY/rti-engine:latest"

  deploy-apps:
    name: Deploy applications
    runs-on: ubuntu-latest
    needs: build-and-push

    # Now that an image exists, the second Bicep pass adds the container
    # apps that reference it.
    steps:
      - uses: actions/checkout@v5

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep (apps)
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >
            deployApps=true
            imageTag=${{ needs.build-and-push.outputs.image_tag }}
            databaseAdminPassword=${{ secrets.DATABASE_ADMIN_PASSWORD }}
            azureOpenAiEndpoint=${{ vars.AZURE_OPENAI_ENDPOINT }}
            azureOpenAiChatDeployment=${{ vars.AZURE_OPENAI_CHAT_DEPLOYMENT }}
            azureOpenAiMiniDeployment=${{ vars.AZURE_OPENAI_MINI_DEPLOYMENT }}
            azureOpenAiEmbeddingDeployment=${{ vars.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
            anthropicModel=${{ vars.ANTHROPIC_MODEL }}
            groqModel=${{ vars.GROQ_MODEL }}
            azureOpenAiApiKey=${{ secrets.AZURE_OPENAI_API_KEY }}
            anthropicApiKey=${{ secrets.ANTHROPIC_API_KEY }}
            groqApiKey=${{ secrets.GROQ_API_KEY }}
            pineconeApiKey=${{ secrets.PINECONE_API_KEY }}
            neo4jPassword=${{ secrets.NEO4J_PASSWORD }}
          failOnStdErr: false

  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    needs: deploy-apps

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get database host
        id: db
        run: |
          host=$(az deployment group show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name main \
            --query properties.outputs.databaseHost.value -o tsv)
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Apply migrations
        env:
          DB_HOST: ${{ steps.db.outputs.host }}
          DB_PASSWORD: ${{ secrets.DATABASE_ADMIN_PASSWORD }}
        run: |
          export POSTGRES_DSN=$(uv run python -c "
          import os
          from urllib.parse import quote
          password = quote(os.environ['DB_PASSWORD'], safe='')
          host = os.environ['DB_HOST']
          print(f'postgresql://rtiadmin:{password}@{host}:5432/rti_engine?sslmode=require')
          ")
          make migrate
