[project]
name = "rti-engine"
version = "0.1.0"
description = "Agentic compliance platform for the EU Pay Transparency Directive (2023/970)"
readme = "README.md"
authors = [
    { name = "trayan4", email = "trayandas@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "azure-identity>=1.25.3",
    "azure-monitor-opentelemetry>=1.8.2",
    "azure-storage-blob>=12.30.0",
    "beautifulsoup4>=4.15.0",
    "faker>=40.36.0",
    "fastapi>=0.141.1",
    "fastmcp>=3.4.5",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.2",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.4.1",
    "langchain-pinecone>=0.2.13",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.1",
    "langsmith>=0.10.10",
    "lxml>=6.1.1",
    "mcp>=1.29.0,<2",
    "numpy>=2.5.1",
    "openevals>=0.2.0",
    "opentelemetry-exporter-otlp-proto-grpc~=1.36.0",
    "opentelemetry-instrumentation-fastapi~=0.57b0",
    "opentelemetry-sdk~=1.36.0",
    "pandas>=3.0.5",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.364",
    "psycopg[binary]>=3.3.4",
    "pulp>=3.3.2",
    "pyarrow>=25.0.0",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "spacy>=3.8.14",
    "sqlalchemy>=2.0.51",
    "statsmodels>=0.14.6",
    "streamlit>=1.59.1",
    "tiktoken>=0.13.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pre-commit",
    "types-pyyaml>=6.0.12.20260724",
    "pandas-stubs>=3.0.3.260530",
    "types-beautifulsoup4>=4.12.0.20250516",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
extend-exclude = ["migrations"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    'ignore:.*PuLP 4\.0.*:DeprecationWarning',
    'ignore:.*starlette\.testclient.*:DeprecationWarning',
]

[[tool.mypy.overrides]]
module = [
    "statsmodels.*",
    "patsy.*",
    "formulaic.*",
    "pulp.*",
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
    "openevals.*",
    "azure.monitor.opentelemetry.*",
    "azure.storage.blob.*",
    "azure.identity.*",
    "azure.core.*",
]
ignore_missing_imports = true
