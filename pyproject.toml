[project]
name = "rti-engine"
version = "0.1.0"
description = "Agentic compliance platform for the EU Pay Transparency Directive (2023/970)"
readme = "README.md"
authors = [
    { name = "trayan4", email = "trayandas@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "beautifulsoup4>=4.15.0",
    "faker>=40.36.0",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.4.1",
    "langchain-pinecone>=0.2.13",
    "lxml>=6.1.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "pulp>=3.3.2",
    "pyarrow>=25.0.0",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.51",
    "statsmodels>=0.14.6",
    "tiktoken>=0.13.0",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pre-commit",
    "types-pyyaml>=6.0.12.20260724",
    "pandas-stubs>=3.0.3.260530",
    "types-beautifulsoup4>=4.12.0.20250516",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
extend-exclude = ["migrations"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ['ignore:.*PuLP 4\.0.*:DeprecationWarning']

[[tool.mypy.overrides]]
module = ["statsmodels.*", "patsy.*", "formulaic.*", "pulp.*"]
ignore_missing_imports = true
